# Based on the examples at https://github.com/r-lib/actions/tree/v2/examples
on:
  push:
    branches: [main]
  pull_request:

name: R-CMD-check

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}
    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: windows-latest, r: 'release'}
          - {os: ubuntu-latest, r: 'release'}
          - {os: ubuntu-latest, r: 'oldrel-1'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual", "--compact-vignettes=gs+qpdf")'

  # The offline suite replays recorded responses; this job runs the
  # integration tests in tests/testthat/test-live.R against a real Trino.
  integration:
    runs-on: ubuntu-latest
    name: integration (Trino 483)

    services:
      trino:
        image: trinodb/trino:483
        ports:
          - 8080:8080

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      RTRINO_TEST_URL: http://localhost:8080

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::devtools
          needs: check

      - name: Wait for Trino to accept queries
        run: |
          for i in $(seq 1 90); do
            if curl -sf http://localhost:8080/v1/info | grep -q '"starting":false'; then
              exit 0
            fi
            sleep 2
          done
          echo "Trino did not start in time"
          exit 1

      - name: Integration tests
        run: Rscript -e 'devtools::test(filter = "live", stop_on_failure = TRUE)'
